name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  firebase_core: ^3.5.0
  cloud_firestore: ^5.4.3
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.0
  http: ^1.5.0
  mime: ^2.0.0
  google_mlkit_text_recognition: ^0.11.0
  path_provider: ^2.1.1
  path: ^1.9.0
  camera: ^0.10.5+5
  flutter_screenutil: ^5.9.0

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Factura_prueba.png
    - assets/icons/
    
    
  fonts:
      - family: Roboto
        fonts:
          - asset: assets/fonts/Roboto-Regular.ttf
            weight: 400
          - asset: assets/fonts/Roboto-Medium.ttf
            weight: 500
          - asset: assets/fonts/Roboto-SemiBold.ttf
            weight: 600
      - family: Inter
        fonts:
          - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
